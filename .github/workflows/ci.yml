name: Code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Check repository, imports and notebooks
        run: python scripts/check_repository.py
      - name: Test scientific methods
        run: python -m pytest -q
      - name: Run synthetic decoder example
        run: python scripts/run_demo.py --output-root outputs/demo
